name: symposium_onboarding
description: Symposium native Flutter onboarding UI, centrally themed.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/syyncin_logo.png
    - assets/images/syyncin_hero.png
